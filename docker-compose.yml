name: sicou

services:
  mail:
    image: axllent/mailpit:latest
    container_name: Sicou-Mail
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  db:
    image: postgres:16
    container_name: Sicou-DB
    restart: unless-stopped
    environment:
      POSTGRES_DB: sicou-dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootroot
    ports:
      - "5433:5432"
    volumes:
      - sicou_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sicou-dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  back:
    image: localhost/sicou-back:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: Sicou-Back
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=sicou-dev;Username=postgres;Password=rootroot
      Cors__AllowedOrigins__0: http://localhost:3000
      Email__Host: ${SMTP_HOST:-mail}
      Email__Port: ${SMTP_PORT:-1025}
      Email__EnableSsl: ${SMTP_ENABLE_SSL:-false}
      Email__Username: ${SMTP_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__FromAddress: ${SMTP_FROM_ADDRESS:-no-reply@sicou.local}
      Email__FrontendBaseUrl: ${SMTP_FRONTEND_BASE_URL:-http://localhost:3000}
    ports:
      - "8080:8080"
    volumes:
      - sicou_post_media:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started

  front:
    image: localhost/sicou-front:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: Sicou-Front
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - back

volumes:
  sicou_postgres_data:
    name: Sicou-DB-Data
  sicou_post_media:
    name: Sicou-Post-Media
